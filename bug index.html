<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soap vs Stink">
<meta name="theme-color" content="#1b2a1f">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>[hidden]{display:none!important}html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Soap vs. Stink</title>
</head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: full-bleed garden canvas; HUD pills float over it; menus are soapy panels on a blurred garden. Single committed look. */
:root{
  color-scheme: dark;
  --ink:#10261a;
  --suds:#effbf8;
  --suds-2:#cdeee7;
  --soap:#1aa3b5;
  --soap-deep:#0f6f7c;
  --stink:#a3c83a;
  --stink-deep:#55721a;
  --warn:#e5484d;
  --gold:#ffc83d;
  --bark:#1b2a1f;
  --hud:rgba(14,34,23,.78);
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--bark);color:var(--suds);font-family:var(--body);font-size:15px;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#safeProbe{position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{cursor:default}

/* HUD */
.hud-top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px;pointer-events:none;flex-wrap:nowrap}
.hud-top>*{pointer-events:auto}
.pill{background:var(--hud);border-radius:999px;padding:7px 13px;display:flex;align-items:center;gap:7px;font-family:var(--display);font-size:18px;line-height:1;letter-spacing:.02em;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.pill .lbl{font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--hud);display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.icon-btn svg{width:18px;height:18px}
.timer{flex:1;min-width:0;max-width:340px}
.tbar{flex:1;min-width:40px;height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--soap);border-radius:6px;transition:background .3s}
.timer.warn .tbar i{background:var(--warn)}
.timer.warn b{color:#ffb0b2;animation:pulse .6s ease-in-out infinite alternate}
.timer b{font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.timer .tic{width:18px;height:18px;flex:none}
@media (max-width:700px){
 .timer{position:fixed;left:12px;right:12px;top:calc(62px + env(safe-area-inset-top,0px));max-width:none;padding:8px 14px;font-size:20px}
 .tbar{height:12px}
 #toast{top:calc(118px + env(safe-area-inset-top,0px)) !important}
}
.hearts{gap:4px;padding:6px 11px}
.hearts svg{width:22px;height:22px;display:block;transition:transform .2s,opacity .2s}
.hearts svg.off{opacity:.28;transform:scale(.8)}
.hearts.hit{animation:hit .5s}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.spacer{flex:1}
.tools{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.tool{position:relative;width:68px;height:68px;border-radius:50%;background:var(--suds);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:900;font-size:11px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 4px 0 var(--soap-deep);overflow:hidden}
.tool svg{width:26px;height:26px}
.tool .cd{position:absolute;inset:0;background:conic-gradient(rgba(14,34,23,.72) calc(var(--cd,0)*1turn),transparent 0);border-radius:50%;pointer-events:none}
.tool .cdn{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:24px;color:var(--suds);text-shadow:0 1px 2px #000}
.tool.armed{background:var(--gold);box-shadow:0 0 0 4px rgba(255,200,61,.45),0 4px 0 #a07a12}
.tool:active{transform:translateY(2px);box-shadow:0 2px 0 var(--soap-deep)}
.sprays{position:fixed;left:12px;right:96px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.sprays::-webkit-scrollbar{display:none}
.sp{flex:none;position:relative;min-width:58px;height:46px;padding:0 10px;border-radius:14px;background:var(--hud);color:var(--suds);font-weight:900;font-size:13px;box-shadow:0 3px 0 rgba(0,0,0,.25);display:flex;align-items:center;gap:6px;border:2px solid transparent}
.sp i{width:12px;height:12px;border-radius:50%;display:block;border:1.5px solid rgba(255,255,255,.7)}
.sp b{font-variant-numeric:tabular-nums;opacity:.85}
.sp.on{background:var(--suds);color:var(--ink);border-color:var(--gold)}
.sp:disabled{opacity:.4}
body.has-sprays .tools{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.soap-pill{position:fixed;right:12px;bottom:calc(122px + env(safe-area-inset-bottom,0px))}
.soap-pill.low b{color:#ffb0b2}
#toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);background:var(--suds);color:var(--ink);font-weight:800;padding:10px 16px;border-radius:14px;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Screens */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(6,20,13,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);overflow:auto}
.screen.clear{background:radial-gradient(ellipse at center,rgba(6,20,13,.15),rgba(6,20,13,.7));-webkit-backdrop-filter:none;backdrop-filter:none}
.panel{background:var(--suds);color:var(--ink);border-radius:28px;padding:24px;width:min(580px,100%);box-shadow:0 8px 0 rgba(0,0,0,.25),0 30px 60px rgba(0,0,0,.35);margin:auto}
.panel h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;margin:0 0 8px;text-wrap:balance;color:var(--ink)}
.panel p{margin:0 0 14px;line-height:1.5;font-weight:600;max-width:60ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:16px;background:var(--suds-2);color:var(--ink);font-weight:900;font-size:16px;box-shadow:0 4px 0 #9fcfc5}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #9fcfc5}
.btn.primary{background:var(--soap);color:#fff;box-shadow:0 4px 0 var(--soap-deep)}
.btn.primary:active{box-shadow:0 2px 0 var(--soap-deep)}
.btn.big{min-height:60px;font-size:20px;font-family:var(--display);font-weight:400;letter-spacing:.02em}
.btn:disabled{opacity:.45;transform:none}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn-row .btn{flex:1 1 140px}

/* Title */
.title-block{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:560px;width:100%}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(54px,14vw,104px);line-height:.9;margin:0;letter-spacing:.01em}
.logo .soap{color:#fff;text-shadow:0 0 0 #fff,4px 4px 0 var(--soap),8px 8px 0 var(--soap-deep)}
.logo .vs{display:block;font-size:.36em;color:var(--gold);margin:6px 0;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.logo .stink{color:var(--stink);display:inline-block;text-shadow:4px 4px 0 var(--stink-deep),8px 8px 0 #2b3a0d;animation:wobble 2.8s ease-in-out infinite}
.tag{font-weight:800;font-size:17px;max-width:34ch;margin:0;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.menu-btns{display:flex;flex-direction:column;gap:12px;width:min(320px,100%)}
.menu-foot{display:flex;gap:16px;align-items:center;font-weight:800}
.bubbles{display:inline-flex;align-items:center;gap:6px;background:var(--hud);padding:8px 14px;border-radius:999px}
.bubbles svg{width:18px;height:18px}
.link{text-decoration:underline;font-weight:800;padding:8px}

/* Levels */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.tab{padding:8px 12px;border-radius:12px;background:var(--suds-2);font-weight:900;font-size:13px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--suds)}
.stage-note{font-size:13px;font-weight:700;opacity:.8;margin:-4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;max-height:46vh;overflow:auto;padding:2px}
.lv{height:58px;border-radius:14px;background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;box-shadow:0 3px 0 #b9ddd5;font-variant-numeric:tabular-nums}
.lv small{font-family:var(--body);font-size:10px;letter-spacing:1px;color:#d49a14;line-height:1}
.lv small .off{color:#c7d6d1}
.lv.boss{background:#fff4d6}
.lv:disabled{background:#dfe9e6;color:#9db3ab;box-shadow:none}
.lv.cur{outline:3px solid var(--soap)}
.foot-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.test-btn{font-size:12px;font-weight:800;text-decoration:underline;color:var(--soap-deep);padding:8px 0}

/* Shop */
.shop-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.shop-head .bubbles{color:var(--suds)}
.shop-list{display:flex;flex-direction:column;gap:10px;margin:12px 0 4px;max-height:58vh;overflow:auto;padding:2px}
.up{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:12px;box-shadow:0 3px 0 #b9ddd5}
.up .ic{width:52px;height:52px;border-radius:14px;background:var(--suds-2);display:grid;place-items:center;color:var(--soap-deep)}
.up .ic svg{width:30px;height:30px}
.up h3{margin:0;font-family:var(--display);font-weight:400;font-size:19px}
.up p{margin:2px 0 4px;font-size:13px;line-height:1.35;font-weight:600}
.up .meta{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--soap-deep)}
.pips{display:flex;gap:4px}
.pips i{width:10px;height:10px;border-radius:50%;background:#d6e7e2}
.pips i.on{background:var(--soap)}
.up .btn{min-height:44px;padding:0 14px;font-size:14px;white-space:nowrap}
.up.locked{opacity:.7}
@media (max-width:460px){.up{grid-template-columns:44px 1fr}.up .ic{width:44px;height:44px}.up .btn{grid-column:1/-1}}

/* Modal */
.stars{display:flex;gap:8px;justify-content:center;margin:4px 0 12px}
.stars svg{width:54px;height:54px}
.stars .off{opacity:.2}
.stars svg:nth-child(2){transform:translateY(-8px)}
.earn{display:flex;justify-content:center;margin-bottom:12px}
.earn .bubbles{color:var(--suds)}
.note{background:#fff4d6;border-radius:12px;padding:10px 12px;font-weight:800;font-size:14px;margin-bottom:12px}
.meet{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding:2px}
.meetrow{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 3px 0 #b9ddd5}
.meetrow img{width:64px;height:64px;border-radius:12px;background:#e3f3ec}
.meetrow h3{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:18px}
.meetrow p{margin:2px 0 0;font-size:14px;line-height:1.35;font-weight:700}
.meetrow .tag{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:#e3f3ec;color:var(--soap-deep)}
.meetrow.bad .tag{background:#f3e7c9;color:#7a4a10}
.meetrow.good .tag{background:#ffe0e4;color:#a0182f}
.more{margin:10px 0 4px;font-size:13px;opacity:.75}
.dyk{background:#e3f3ec;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;line-height:1.4;margin-bottom:12px}
.newbug{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;margin-bottom:12px}
.newbug img{width:110px;height:110px;background:#e3f3ec;border-radius:18px}
.guide{display:flex;flex-direction:column;gap:8px;max-height:58vh;overflow:auto;padding:2px;margin-bottom:6px}
.gh{margin:6px 0 0;font-family:var(--display);font-weight:400;font-size:18px}
.gcard{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:10px;box-shadow:0 3px 0 #b9ddd5}
.gcard img,.gcard .q{width:72px;height:72px;border-radius:12px;background:#e3f3ec}
.gcard .q{display:grid;place-items:center;font-family:var(--display);font-size:34px;color:#9db3ab}
.gcard h3{margin:0;font-family:var(--display);font-weight:400;font-size:17px}
.gcard p{margin:2px 0 0;font-size:13px;line-height:1.4;font-weight:600}
.gcard .tip{color:var(--soap-deep);font-weight:800}
.gcard.locked{opacity:.65}
@media (max-width:460px){.newbug{grid-template-columns:1fr}.newbug img{margin:0 auto}}
.howto{display:flex;flex-direction:column;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.howto li{display:flex;gap:10px;align-items:flex-start;font-weight:700;line-height:1.4}
.howto b{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--soap);color:#fff;font-family:var(--display);font-weight:400}

@keyframes pulse{to{opacity:.55}}
@keyframes wobble{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.logo .stink,.timer.warn b{animation:none}#toast{transition:none}}
</style>

<div id="app">
  <canvas id="cv" aria-label="Garden. Swipe leaves aside and tap bugs to spray them."></canvas>
  <div id="safeProbe"></div>

  <div id="hud" hidden>
    <div class="hud-top">
      <button class="icon-btn" id="btnPause" aria-label="Pause"><svg viewBox="0 0 18 18" fill="currentColor"><rect x="3" y="2" width="4" height="14" rx="1.5"/><rect x="11" y="2" width="4" height="14" rx="1.5"/></svg></button>
      <div class="pill"><span class="lbl">Lvl</span><b id="hudLevel">1</b></div>
      <div class="pill" title="Bugs left"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3l-2.5 2.5L4 8c-.6 4 1 10 8 13 7-3 8.6-9 8-13l-5.5-2.5z" fill="#a3c83a"/><path d="M8.5 10h7L12 17z" fill="#55721a"/></svg><b id="hudBugs">0</b></div>
      <div class="pill timer" id="hudTimer" hidden><svg class="tic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10" cy="11" r="7"/><path d="M10 7v4l2.5 2M8 2h4"/></svg><div class="tbar"><i id="hudTimerBar"></i></div><b id="hudTime">45</b></div>
      <div class="spacer" id="hudSpacer"></div>
      <div class="pill hearts" id="hudLives" title="Lives"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4 6.8 4c2.2 0 3.7 1.2 5.2 3 1.5-1.8 3-3 5.2-3C21 4 23.1 8 21.6 11.6 19.5 16.4 12 21 12 21z" fill="#ff5a6a" stroke="#fff" stroke-width="1.5"/></svg><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4 6.8 4c2.2 0 3.7 1.2 5.2 3 1.5-1.8 3-3 5.2-3C21 4 23.1 8 21.6 11.6 19.5 16.4 12 21 12 21z" fill="#ff5a6a" stroke="#fff" stroke-width="1.5"/></svg><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4 6.8 4c2.2 0 3.7 1.2 5.2 3 1.5-1.8 3-3 5.2-3C21 4 23.1 8 21.6 11.6 19.5 16.4 12 21 12 21z" fill="#ff5a6a" stroke="#fff" stroke-width="1.5"/></svg></div>
    </div>
    <div class="tools">
      <button class="tool" id="btnSniff" hidden aria-label="Bug sniffer"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L23 23"/><path d="M8 9.5c1-1.5 2.5-2 4-1.5" stroke-width="2"/></svg><span>Sniff</span><i class="cd"></i><b class="cdn" id="sniffN"></b></button>
      <button class="tool" id="btnMist" hidden aria-label="Mist mode"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 15a5 5 0 0 1 1-9.8A6 6 0 0 1 18.5 6 4.5 4.5 0 0 1 19 15z"/><path d="M8 19v2M13 18v4M18 19v2"/></svg><span>Mist <b id="mistN">1</b></span></button>
    </div>
    <div class="pill soap-pill" id="hudSoap" hidden><span class="lbl">Soap</span><b id="soapN">8</b></div>
  </div>
    <div class="sprays" id="sprayBar" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <section class="screen clear" id="scr-menu" hidden>
    <div class="title-block">
      <h1 class="logo"><span class="soap">Soap</span><span class="vs">vs.</span><span class="stink">Stink</span></h1>
      <p class="tag">Push the leaves aside, find the stink bugs, and soak them with soapy water before they stink you out.</p>
      <div class="menu-btns">
        <button class="btn primary big" id="mPlay">Play</button>
        <button class="btn" id="mLevels">Choose a level</button>
        <button class="btn" id="mShop">Soap Shop</button>
        <button class="btn" id="mGuide">Bug Guide</button>
      </div>
      <div class="menu-foot">
        <span class="bubbles"><svg viewBox="0 0 20 20" fill="none" stroke="#9feaf3" stroke-width="2"><circle cx="8" cy="11" r="6"/><circle cx="15" cy="5" r="3"/></svg><b id="mBubbles">0</b> bubbles</span>
        <button class="link" id="mSound">Sound: on</button>
      </div>
    </div>
  </section>

  <section class="screen" id="scr-levels" hidden>
    <div class="panel">
      <h2>Choose a level</h2>
      <div class="tabs" role="tablist" id="stageTabs"></div>
      <p class="stage-note" id="stageNote"></p>
      <div class="grid" id="lvGrid"></div>
      <div class="foot-row">
        <button class="btn" id="lvBack">Back</button>
        <button class="test-btn" id="lvTest">Parent test mode</button>
      </div>
    </div>
  </section>

  <section class="screen" id="scr-shop" hidden>
    <div class="panel">
      <div class="shop-head"><h2>Soap Shop</h2><span class="bubbles"><svg viewBox="0 0 20 20" fill="none" stroke="#9feaf3" stroke-width="2"><circle cx="8" cy="11" r="6"/><circle cx="15" cy="5" r="3"/></svg><b id="shopBubbles">0</b></span></div>
      <p style="margin:0">Earn bubbles from stars. New tools and sprays unlock as you go. Sprays refill at the start of every level.</p>
      <div class="shop-list" id="shopList"></div>
      <div class="btn-row"><button class="btn" id="shopBack">Back</button></div>
    </div>
  </section>

  <section class="screen" id="scr-modal" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <h2 id="mTitle"></h2>
      <div id="mBody"></div>
      <div class="btn-row" id="mBtns"></div>
    </div>
  </section>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

let AC=null,master=null,noiseBuf=null;
function audio(){if(save.mute)return null;if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);}catch(e){return null;}}if(AC.state==='suspended')AC.resume();return AC;}
function noise(){if(!noiseBuf){const n=AC.sampleRate;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}return noiseBuf;}
function nz(t0,dur,type,freq,q,vol){const s=AC.createBufferSource();s.buffer=noise();const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t0,Math.random()*.4);s.stop(t0+dur+.05);return f;}
function tone(t0,dur,f0,f1,type,vol){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t0);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);const g=AC.createGain();g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.05);}
function sfx(fn){return()=>{const a=audio();if(!a)return;try{fn(a.currentTime);}catch(e){}};}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const shadeCache=new Map();
function shade(hex,amt){const k=hex+amt;let v=shadeCache.get(k);if(v)return v;const n=parseInt(hex.slice(1),16);let r=n>>16&255,g=n>>8&255,b=n&255;const t=amt<0?0:255,p=Math.abs(amt);r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);v='#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);shadeCache.set(k,v);return v;}

function params(lev){
 const st=lev<50?1:lev<100?2:lev<150?3:4;
 const p={lev,st,scouts:0,nymphs:0,reloc:0,react:99,speed:200,timed:false,time:0,wind:false};
 const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
 if(st===1){p.bugs=1+Math.floor((lev-1)/7);p.peek=lev<=3?1:Math.max(.1,.85-(lev-4)*.018);p.bugR=21-(lev/49)*4;}
 else if(st===2){p.bugs=6+Math.floor((lev-50)/8);p.peek=.1;p.bugR=15;p.timed=true;p.time=cl(Math.round(15+p.bugs*4),45,70);p.reloc=1;p.react=Math.max(1,1.6-(lev-50)*.012);p.speed=200;}
 else if(st===3){p.bugs=12+Math.floor((lev-100)/10);p.peek=.05;p.bugR=13.5;p.timed=true;p.time=cl(Math.round(15+p.bugs*3.5),55,75);p.reloc=2;p.react=.95;p.speed=240;p.scouts=Math.min(4,1+Math.floor((lev-100)/15));}
 else{p.bugs=16+Math.floor((lev-150)/10);p.peek=0;p.bugR=12;p.timed=true;p.time=cl(Math.round(15+p.bugs*3),60,80);p.reloc=2;p.react=.8;p.speed=290;p.scouts=Math.min(4,2+Math.floor((lev-150)/20));p.nymphs=Math.min(3,1+Math.floor((lev-150)/17));p.wind=true;}
 // Wandering: from level 5 bugs crawl to new hiding spots on their own, more often and faster as levels rise
 // Higher levels: bugs shrink, crawl faster, wander more often and take more sprays
 p.bugR=Math.max(9.5,21-lev*.058);
 p.wander=Math.max(1.8,7.5-lev*.03);
 p.wspd=55+lev*1.0;
 p.speed=Math.max(p.speed,120+lev*1.1);
 p.hp=lev<70?1:lev<140?2:3;
 if(p.hp>1&&p.timed)p.time=Math.round(p.time+p.bugs*(p.hp-1)*2.5);
 p.wrange=lev<20?300:lev<50?450:650;
 p.friends=lev<10?1:lev<30?2:lev<80?3:lev<150?4:5;
 p.tank=lev>=60;
 p.queen=false;p.boss=lev>=10&&lev%10===0;
 p.shell=p.boss?2+Math.floor(lev/50):0;p.bossHp=p.boss?2+Math.floor(lev/50):0;
 Object.assign(p,scene(lev));
 return p;
}
// Scenery: random each time a level starts. Indoors or outdoors, more plants and more often outdoors as levels rise.
function scene(lev){
 if(window.__svsForce)return window.__svsForce;
 const r=Math.random;const pick=a=>a[Math.floor(r()*a.length)];
 const mix=(pool,n)=>{const out=[];let last='';for(let i=0;i<n;i++){let k;do{k=pick(pool);}while(k===last&&pool.length>1);out.push(k);last=k;}return out;};
 const n=lev<10?1:lev<20?2:lev<50?2+(r()<.5?1:0):lev<100?3+(r()<.4?1:0):lev<150?3+(r()<.6?1:0):4+(r()<.5?1:0);
 const outdoor=lev<5?false:r()<Math.min(.8,.35+lev*.004);
 if(!outdoor)return{bg:1,ground:'pot',outdoor:false,plants:mix(lev<10?['succulent','lily','lemon']:['succulent','lily','monstera','fern','lemon','hibiscus'],n)};
 const bg=lev<60?2:pick(lev<120?[2,2,3,4]:[2,3,4,4]);
 const pool=bg===3?['monstera','fern','lily','hibiscus','rose']:['tomato','rose','lily','fern','monstera','lemon','bean','sunflower','hibiscus','wattle','corn'];
 return{bg,ground:lev<40||r()<.35?'pot':'bed',outdoor:true,plants:mix(pool,n)};
}

 xs.forEach((cx,ri)=>{

  [{k:8,len:120,w:58,sp:3.6},{k:6,len:88,w:46,sp:3.0},{k:4,len:56,w:34,sp:2.2}].forEach((r,ri2)=>{
   for(let i=0;i<r.k;i++){const ang=-Math.PI/2+(i/(r.k-1)-.5)*r.sp+(rng()-.5)*.2;
    B.addCover({type:'succ',bx:cx,by:cy,a0:ang,len:r.len*sc*(.9+rng()*.2),w:r.w*sc,cwf:.95,depth:ri2*10+rng()*5+ri*.1});}

function canopyBush(B,o,rng,{trunkH,branches,spreadR,stemCol,stemW}){

/* ---------------- Level build ---------------- */
let G=null;
function refreshCover(c){const a=c.a0+c.off+c.sway;c.ca=Math.cos(a);c.sa=Math.sin(a);c.rx=c.len/2;c.ry=c.cw/2;c.cx=c.bx+c.ca*c.rx;c.cy=c.by+c.sa*c.rx;}
function inEll(c,x,y,k){const dx=x-c.cx,dy=y-c.cy;const u=dx*c.ca+dy*c.sa,v=-dx*c.sa+dy*c.ca;const rx=c.rx*k,ry=c.ry*k;return u*u/(rx*rx)+v*v/(ry*ry)<=1;}
function coveredIn(covers,x,y){for(let i=0;i<covers.length;i++)if(inEll(covers[i],x,y,.92))return true;return false;}
function covered(x,y){return coveredIn(G.covers,x,y);}
const WX={sun:{cloud:0,rain:0,wind:0,label:'Sunny'},cloudy:{cloud:.8,rain:0,wind:.15,label:'Cloudy'},rain:{cloud:.9,rain:1,wind:.25,label:'Rain'},wind:{cloud:.3,rain:0,wind:1,label:'Windy'},storm:{cloud:1,rain:1,wind:1,label:'Storm'}};
const WXMSG={sun:'The sun is out!',cloudy:'Clouds are rolling in.',rain:'It\u2019s raining! Rain fills your soap bottle faster.',wind:'Windy! Gusts blow the leaves open.',storm:'Storm! Wind and rain at once.'};
function pickWeather(prev,lev){const pool=['sun','sun','cloudy','rain','wind'];if(lev>=60)pool.push('storm');let k;do{k=pool[Math.floor(Math.random()*pool.length)];}while(k===prev);return k;}
function newWeather(P){const w={kind:'sun',cloud:0,rain:0,wind:P.bg===4?.35:0,next:14+Math.random()*10,gust:4,flash:0,drops:[]};
 if(P.outdoor){w.kind=pickWeather('',P.lev);const t=WX[w.kind];w.cloud=t.cloud;w.rain=t.rain;w.wind=Math.max(w.wind,t.wind);}
 for(let i=0;i<220;i++)w.drops.push({x:Math.random(),y:Math.random(),v:.9+Math.random()*.5});return w;}
function updWeather(dt){const w=G.weather;if(!G.P.outdoor)return;
 if(!G.demo&&!G.paused){w.next-=dt;if(w.next<=0){w.next=14+Math.random()*12;w.kind=pickWeather(w.kind,G.lev);toast(WXMSG[w.kind]);}}
 const t=WX[w.kind],k=Math.min(1,dt*.6);w.cloud+=(t.cloud-w.cloud)*k;w.rain+=(t.rain-w.rain)*k;w.wind+=(Math.max(t.wind,G.P.bg===4?.35:0)-w.wind)*k;
 for(const d of w.drops){d.y+=dt*d.v*1.6;d.x-=dt*.12*w.wind;if(d.y>1){d.y-=1;d.x=Math.random();}if(d.x<0)d.x+=1;}
 if(w.flash>0)w.flash-=dt*2.5;
 if(w.kind==='storm'&&Math.random()<dt*.12)w.flash=1;
 if(w.wind>.6&&!G.demo){w.gust-=dt;if(w.gust<=0){w.gust=3+Math.random()*4;const dir=Math.random()<.5?-1:1;for(const c of G.covers){if(c.type==='fallen'||c.type==='fruit')continue;c.vel+=dir*(1.6+Math.random()*1.4)*w.wind;}}}
}
function initCharges(P){const c={};for(const k in SPRAYS){if(k==='soap')continue;c[k]=SPRAYS[k].ch[save.up[k]||0];}if(P.boss)c.oil=Math.max(c.oil,P.shell+3);return c;}
function leafPoint(c,r){const t=.3+r()*.5,l=(r()-.5)*.5;const ca=Math.cos(c.a0+(c.off||0)),sa=Math.sin(c.a0+(c.off||0));return{x:c.bx+ca*t*c.len-sa*l*c.cw/2,y:c.by+sa*t*c.len+ca*l*c.cw/2};}

function buildLevel(lev,demo){
 const P=params(lev);const rng=mulberry32(lev*7919+13+Math.floor(Math.random()*1e6));const st=P.st,dusk=P.bg===4;
 const B={covers:[],stems:[],decor:[],
  addCover(c){c.off=0;c.vel=0;c.hold=0;c.sway=0;c.ph=rng()*TAU;c.cw=c.cw||c.w*(c.cwf||1);c.depth=c.depth||0;const pal=PAL[c.type];c.col=pal[Math.floor(rng()*pal.length)];if(dusk)c.col=shade(c.col,-.12);this.covers.push(c);return c;},
  stem(pts,w,col){this.stems.push({pts,w,col:dusk?shade(col,-.2):col});}};
 const n=P.plants.length;
 const nT=st===1?Math.max(9,P.bugs*2+7):st===2?P.bugs*2+6:st===3?Math.round(P.bugs*1.3+6):Math.round(P.bugs*1.5+8);

function update(dt){

  if(c.hold>0)c.hold-=dt;else{const acc=-7*c.off-3.6*c.vel;c.vel+=acc*dt;c.off+=c.vel*dt;}refreshCover(c);}
 for(const f of G.flies){f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.x<G.wx[0]||f.x>G.wx[1])f.vx*=-1;if(f.y<200||f.y>900)f.vy*=-1;f.vx+=rand(-20,20)*dt;f.vy+=rand(-20,20)*dt;f.vx=clamp(f.vx,-30,30);f.vy=clamp(f.vy,-20,20);}
 updParticles(dt);
 if(G.demo||G.paused)return;
 if(G.spray)G.spray.t+=dt;
 if(G.cloudT>0)G.cloudT-=dt;if(G.fresh>0)G.fresh-=dt;

 for(let i=G.floaters.length-1;i>=0;i--){G.floaters[i].t+=dt;if(G.floaters[i].t>1.1)G.floaters.splice(i,1);}
 for(let i=G.splats.length-1;i>=0;i--){G.splats[i].t-=dt;if(G.splats[i].t<=0)G.splats.splice(i,1);}
 for(let i=G.baits.length-1;i>=0;i--){G.baits[i].t-=dt;if(G.baits[i].t<=0)G.baits.splice(i,1);}
 for(const b of G.bugs){
  if(b.flash>0)b.flash-=dt;
  if(b.kind==='boss'&&b.regrow>0&&b.shell<=0&&b.state!=='dead'){b.regrow-=dt;if(b.regrow<=0){b.shell=Math.ceil(b.shellMax/2);toast('The Stink King grew his shell back! Use Oil again.');}}
  if(b.state==='dead'){b.deadT+=dt;if(b.deadT<.9&&Math.random()<.6)particles(b.bx0+b.bvx*b.deadT,b.by0+b.bvy*b.deadT+750*b.deadT*b.deadT,1,'bubble');if(b.deadT>1.5)b.state='gone';continue;}

   if((P.reloc||b.skit)&&b.relocLeft>0&&b.expT>(b.react||P.react)&&!b.peek)relocate(b,true);
   else if(P.wander&&b.kind!=='nymph'&&b.state==='hidden'){b.wT-=dt;if(b.wT<=0){b.wT=P.wander*(.7+Math.random()*.6)*(b.wMul||1);wander(b);}}
   if(b.kind==='scout'){b.flyT-=dt;if(b.flyT<=0){b.flyT=rand(5,8);fly(b);}}
  }else if(b.state==='crawl'){
   b.leg+=dt*18;const dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy),sp=(b.spd||P.speed)*dt;
   if(d<=sp){b.x=b.tx;b.y=b.ty;if(b.toBait){b.state='eat';b.eatT=4+Math.random()*2;}else{b.state='hidden';b.expT=0;}}else{b.x+=dx/d*sp;b.y+=dy/d*sp;b.ang=Math.atan2(dy,dx)+Math.PI/2;}
  }else if(b.state==='fly'){
   b.ft+=dt/b.fdur;const u=Math.min(1,b.ft);const mx=(b.fx+b.tx)/2,my=Math.min(b.fy,b.ty)-170;

  }

  row.innerHTML=`<div class="ic">${u.icon}</div><div style="min-width:0"><h3>${u.name}</h3><p>${u.desc}</p><div class="meta"><span class="pips">${pips}</span>${tier?u.tiers[tier-1]:'Not owned yet'}</div></div>`;
  const b=document.createElement('button');b.className='btn'+(unlocked&&tier<maxT&&save.bubbles>=u.prices[tier]?' primary':'');
  if(!unlocked){b.textContent='Unlocks at level '+u.unlock;b.disabled=true;}
  else if(tier>=maxT){b.textContent='Maxed';b.disabled=true;}
  else{const pr=u.prices[tier];b.textContent=(tier?'Upgrade':'Buy')+' · '+pr;b.disabled=save.bubbles<pr;
   b.addEventListener('click',()=>{if(save.bubbles<pr)return;save.bubbles-=pr;save.up[u.id]++;persist();SFX.buy();renderShop();toast(u.name+': '+u.tiers[save.up[u.id]-1]);});}
  row.appendChild(b);list.appendChild(row);});
}
$('shopBack').addEventListener('click',toMenu);

/* Menu */
$('mPlay').addEventListener('click',()=>{audio();startLevel(Math.min(save.max,200));});
$('mLevels').addEventListener('click',()=>{audio();openLevels();});
$('mGuide').addEventListener('click',()=>{audio();openGuide();});
$('mShop').addEventListener('click',()=>{audio();openShop();});
$('mSound').addEventListener('click',()=>{save.mute=!save.mute;persist();$('mSound').textContent='Sound: '+(save.mute?'off':'on');if(!save.mute)audio();});

window.__svs={startLevel,buildLevel,params,update,tap,push,render,onWin,onFail,setG:v=>{G=v;},getG:()=>G};
resize();toMenu();requestAnimationFrame(frame);
})();
</script>

</body></html>
